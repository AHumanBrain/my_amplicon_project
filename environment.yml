name: amplicon_pipeline
channels:
  - bioconda
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - nextflow>=25.04,<26
  - fastqc
  - cutadapt
  - bwa
  - samtools
  - picard
  - gatk4
  - multiqc
  - openjdk=17
  - matplotlib
  - biopython
  - primer3-py
  - tqdm
  - blast
  - numpy
  - pytest
  - pyflakes
