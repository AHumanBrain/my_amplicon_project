<!doctype html>
<html><head><meta charset="utf-8"><title>IGV</title></head>
<body style="margin:10px;background:#fff">
<div id="igv"></div>
<script type="module">
  import igv from "./igv.esm.min.js";
  const cfg = await (await fetch(new URLSearchParams(location.search).get("cfg"))).json();
  window.browser = await igv.createBrowser(document.getElementById("igv"), cfg);
  window.igvReady = true;
</script></body></html>
