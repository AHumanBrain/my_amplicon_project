# Project file for design.py:   python design.py --project panel.example.toml
# Paths are relative to this file. Any command-line option overrides what is set here.
name = "sars2_tiled_demo"
targets = "design/targets/sars2_tiles.tsv"      # 99 overlapping 400 bp windows over SARS-CoV-2 (30 kb)
reference = ["examples/sars2/NC_045512.2.fa"]
# specificity_fasta = ["transcripts.fa", "genome.fa"]   # default: the reference. For RNA give transcriptome AND genome.
output_prefix = "design/output/sars2_demo"
blast_dir = "ncbi_data"

[design]
layout = "auto"            # auto | tiled | sparse. tiled = at most 2 pools by position (A,C | B,D)
amplicon_min = 330
amplicon_max = 400
max_hits = 1               # exact full-length hits allowed per primer in each specificity database
# max_cross_product = 1000 # bp; default 1000 (sparse) or the max amplicon size (tiled); 0 disables
num_candidates = 25
monte_carlo_iters = 20
seed = 0                   # same inputs + same seed = identical output
# max_pools = 0            # sparse only: keep at most N pools (0 = no limit)
# rescue = false
# force_multiprime = false

[primers]                  # primer3 limits. These suit an AT-rich genome (SARS-CoV-2 is 38% GC); the tool defaults are
min_size = 20              #   19-21 nt, 40-60% GC, Tm 59-61, which cannot place primers across much of it
max_size = 30
min_gc = 30.0
max_gc = 60.0
min_tm = 57.0              # KAPA conditions; fallback strategies widen this window by 2 then 4 C
max_tm = 64.0

[tails]
enabled = true             # false = order bare gene-specific primers
forward = "ACACGACGCTCTTCCGATCT"   # truncated Illumina P5 / Read 1
reverse = "GACGTGTGCTCTTCCGATCT"   # truncated Illumina P7 / Read 2

[thresholds]               # kcal/mol
self_dimer_dg = -9.0
heterodimer_dg = -8.0
end_stability_dg = -6.0
