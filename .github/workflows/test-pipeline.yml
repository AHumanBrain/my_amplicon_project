name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-design:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install biopython primer3-py tqdm pandas matplotlib numpy pytest pyflakes

      - name: Lint (undefined names are errors)
        run: python -m pyflakes design.py core analysis scripts

      - name: Run unit tests
        run: pytest test_design.py -v --tb=short

  test-pipeline:
    name: Nextflow stub run
    runs-on: ubuntu-latest
    needs: test-design
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          environment-name: amplicon_pipeline
          cache-environment: true

      - name: Verify tool installations
        shell: micromamba-shell {0}
        run: |
          nextflow -version
          bwa 2>&1 | head -1 || true
          samtools --version | head -1
          cutadapt --version

      - name: Build test fixture (genome slice, BED, primers, simulated reads)
        shell: micromamba-shell {0}
        run: python scripts/make_test_fixture.py --outdir "$RUNNER_TEMP/fixture"

      - name: Run pipeline (stub)
        shell: micromamba-shell {0}
        run: |
          FX="$RUNNER_TEMP/fixture"
          cd analysis
          nextflow run main.nf \
            --genome "$FX/genome.fna" \
            --reads "$FX/FixtureSample_R{1,2}.fastq.gz" \
            --primers "$FX/primers_trimming.fasta" \
            --bed "$FX/targets.bed" \
            --outdir "$RUNNER_TEMP/results" \
            -stub-run \
            -work-dir "$RUNNER_TEMP/nf_work"

      - name: Check expected outputs
        run: |
          test -f "$RUNNER_TEMP/results/multiqc/multiqc_report.html"
          ls "$RUNNER_TEMP/results"
