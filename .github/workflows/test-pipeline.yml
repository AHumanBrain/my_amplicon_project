name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-design:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environment.yml

      - name: Install dependencies
        run: pip install biopython primer3-py tqdm matplotlib numpy pytest pyflakes

      - name: Lint (undefined names are errors)
        run: python -m pyflakes design.py core analysis scripts

      - name: Run unit tests
        run: pytest test_design.py -v --tb=short

  test-pipeline:
    name: Nextflow stub run
    runs-on: ubuntu-latest
    needs: test-design
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          environment-name: amplicon_pipeline
          cache-environment: true

      - name: Verify tool installations
        shell: micromamba-shell {0}
        run: |
          nextflow -version
          bwa 2>&1 | head -1 || true
          samtools --version | head -1
          cutadapt --version

      - name: Design smoke test with real BLAST (RNA junction example)
        shell: micromamba-shell {0}
        run: |
          EX="$RUNNER_TEMP/rna"
          python scripts/make_rna_example.py --outdir "$EX"
          python design.py --targets "$EX/targets.tsv" --reference "$EX/cdna.fa" \
            --specificity-fasta "$EX/cdna.fa" "$EX/genome.fa" \
            --blast-dir "$EX/db" --output-prefix "$EX/out" --num-candidates 20
          python - <<PY
          import csv, os
          rows = {r["target_id"]: r for r in csv.DictReader(open(os.environ["RUNNER_TEMP"] + "/rna/out_pool_1.csv"))}
          plain, junc = rows["TX1_plain"], rows["TX1_junction"]
          assert "genome:" in plain["predicted_products"], "unconstrained design should show a genomic product"
          assert "genome:" not in junc["predicted_products"], "junction-spanning design must not amplify genomic DNA"
          print("junction constraint removes genomic product:", junc["predicted_products"])
          PY

      - name: Build test fixture (genome slice, BED, primers, simulated reads)
        shell: micromamba-shell {0}
        run: python scripts/make_test_fixture.py --outdir "$RUNNER_TEMP/fixture"

      - name: Run pipeline (stub, fast structure check)
        shell: micromamba-shell {0}
        run: |
          FX="$RUNNER_TEMP/fixture"
          cd analysis
          nextflow run main.nf \
            --genome "$FX/genome.fna" \
            --reads "$FX/FixtureSample_R{1,2}.fastq.gz" \
            --primers "$FX/primers_trimming.fasta" \
            --bed "$FX/targets.bed" \
            --outdir "$RUNNER_TEMP/results_stub" \
            -stub-run \
            -work-dir "$RUNNER_TEMP/nf_work_stub"

      - name: Run pipeline (real BWA / Picard / GATK on fixture)
        shell: micromamba-shell {0}
        run: |
          FX="$RUNNER_TEMP/fixture"
          cd analysis
          nextflow run main.nf \
            --genome "$FX/genome.fna" \
            --reads "$FX/FixtureSample_R{1,2}.fastq.gz" \
            --primers "$FX/primers_trimming.fasta" \
            --bed "$FX/targets.bed" \
            --outdir "$RUNNER_TEMP/results" \
            -work-dir "$RUNNER_TEMP/nf_work"

      - name: Check expected outputs
        run: |
          R="$RUNNER_TEMP/results"
          for f in multiqc/multiqc_report.html \
                   report/FixtureSample_balancing_feedback.json \
                   report/FixtureSample_target_summary.tsv \
                   report/FixtureSample_uniformity.png \
                   variants/germline/FixtureSample.g.vcf.gz \
                   qc/picard/FixtureSample_pcr_metrics.txt; do
            test -s "$R/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          ls -R "$R" | head -50
