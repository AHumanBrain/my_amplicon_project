# Fast checks on every push / PR: lint + unit tests (about a minute, no external tools).
# The real-tool checks (BLAST, bwa, samtools, cutadapt) live in scripts/check_all.sh and the manual
# "real-tools" workflow; the analysis end-to-end test is skipped here because those tools are absent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environment.yml

      - name: Install Python dependencies
        run: pip install biopython primer3-py tqdm matplotlib numpy pytest pyflakes

      - name: Lint (undefined names are errors)
        run: python -m pyflakes design.py core analysis scripts

      - name: Unit tests
        run: python -m pytest test_design.py -v --tb=short
